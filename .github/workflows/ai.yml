name: Invite AI Contributor

on:
  workflow_dispatch: # 允许网页手动触发

jobs:
  make-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Let DeepSeek Org work for me
        run: |
          # 1. 直接配置为 DeepSeek 官方组织名字和公开对外邮箱
          git config --global user.name "deepseek-ai"
          git config --global user.email "service@deepseek.com"
          
          # 2. 随便修改一个文件（为了触发新的提交）
          echo "DeepSeek Official updated this!" >> deepseek.txt
          
          # 3. 提交并推送
          git add deepseek.txt
          git commit -m "chore: code review by deepseek-ai org"
          git push
