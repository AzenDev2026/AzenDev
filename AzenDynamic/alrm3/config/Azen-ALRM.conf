# ============================================
# Azen ALRM 配置文件
# 位置: /etc/azen-alrm/Azen-ALRM.conf
# ============================================

# ---------- 电池管理 ----------
# 低电量阈值（%），低于此值进入省电策略
BATTERY_LOW = 20

# 危急电量阈值（%），低于此值强制降频
BATTERY_CRITICAL = 10

# ---------- 温度管理 ----------
# 警告温度（摄氏度）
TEMP_WARN = 75

# 危急温度（摄氏度），超过则强制限制
TEMP_CRITICAL = 85

# ---------- 调度 ----------
# 扫描间隔（秒）
SCAN_INTERVAL = 5

# ---------- AppNap ----------
# 是否启用 AppNap
ENABLE_APP_NAP = true

# CPU 阈值（%），低于此值的后台应用才会被冻结
CPU_THRESHOLD = 20

# 冻结超时（秒），超过则自动释放
FREEZE_TIMEOUT = 30

# 白名单，逗号分隔（不会被冻结的应用）
WHITELIST =

# ---------- 日志 ----------
# 是否输出详细日志
VERBOSE = false
