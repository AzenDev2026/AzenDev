# ---------- 电池阈值 ----------
# 低电量阈值(%)
BATTERY_LOW=20

# 危险电量阈值(%)
BATTERY_CRITICAL=10

# ---------- 温度阈值 ----------
# 预警温度(摄氏度)
TEMP_WARN=75

# 危险温度(摄氏度)
TEMP_CRITICAL=85

# ---------- 睡眠行为 ----------
# 进入睡眠前的延迟(秒)
SLEEP_DELAY=5

# 是否优先使用 deep(ACPI S3) 深度睡眠
# false = 优先 s2idle（兼容性好，推荐）
# true  = 优先 deep（更省电，但部分机型合盖可能黑屏）
PREFER_DEEP_SLEEP=false

# ---------- 日志 ----------
# 开启详细日志
VERBOSE=false